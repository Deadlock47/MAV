<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAV Desktop</title>
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="ambient ambient-one"></div>
      <div class="ambient ambient-two"></div>
      <div class="ambient ambient-three"></div>

      <header class="chrome">
        <div class="route-pill" id="route-pill">/booting</div>

        <div class="headline">
          <p class="kicker">Electron catalog shell</p>
          <h1>MAV Controllllllllllllllllllllllll Room</h1>
          <p class="lede">
            A local desktop browser for your DuckDB-backed JAV archive and your
            Mahwa JSON shelf.
          </p>
        </div>

        <nav class="tab-strip" id="tab-strip"></nav>
        <div class="toolbar" id="toolbar"></div>
      </header>

      <main class="content" id="content"></main>
    </div>

    <script type="module" src="./app/main.js"></script>
  </body>
</html>
